<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC Receiver & Decoder</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; }
        .container { padding: 20px; }
        #video { width: 100%; max-width: 400px; border: 2px solid #444; border-radius: 10px; }
        #canvas { display: none; }
        .data-box { background: #111; padding: 15px; border-radius: 10px; margin-top: 10px; min-height: 50px; border: 1px solid #333; }
        #indicator { width: 20px; height: 20px; border-radius: 50%; display: inline-block; background: red; }
        .btn { background: #00ff88; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; max-width: 400px; }
        #debug { font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>VLC Receiver</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <div style="margin: 10px 0;">
        <span id="indicator"></span> Status: <span id="syncStatus">Waiting for Light...</span>
    </div>

    <button class="btn" onclick="startCamera()">ACTIVATE CAMERA</button>

    <div class="data-box">
        <strong>Decoded Message:</strong>
        <div id="decodedText" style="color: #00ff88; font-size: 24px; margin-top: 5px;"></div>
    </div>
    
    <div id="debug">Brightness Level: 0</div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const decodedText = document.getElementById('decodedText');
    const debug = document.getElementById('debug');
    const indicator = document.getElementById('indicator');

    let isListening = false;
    let lastState = false; 
    let startTime = 0;
    let morseBuffer = "";

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            isListening = true;
            processFrame();
        } catch (err) {
            alert("क्यामेरा एक्सेस मिलेन!");
        }
    }

    function processFrame() {
        if (!isListening) return;

        // भिडियोको सानो भाग मात्र चेक गर्ने (Performance को लागि)
        canvas.width = 100;
        canvas.height = 100;
        ctx.drawImage(video, 40, 40, 20, 20, 0, 0, 100, 100);
        
        const imageData = ctx.getImageData(0, 0, 100, 100);
        const data = imageData.data;
        let r, g, b, avg;
        let totalBrightness = 0;

        for (let i = 0; i < data.length; i += 4) {
            r = data[i]; g = data[i+1]; b = data[i+2];
            avg = (r + g + b) / 3;
            totalBrightness += avg;
        }

        const brightness = totalBrightness / (data.length / 4);
        debug.innerText = `Brightness Level: ${Math.round(brightness)}`;

        // Threshold Logic (वातावरण अनुसार मिलाउनुपर्ने हुन सक्छ)
        const threshold = 180; 
        const currentState = brightness > threshold;

        if (currentState !== lastState) {
            const duration = Date.now() - startTime;
            handleStateChange(lastState, duration);
            startTime = Date.now();
            lastState = currentState;
            indicator.style.background = currentState ? "#00ff88" : "red";
        }

        requestAnimationFrame(processFrame);
    }

    function handleStateChange(state, duration) {
        if (state === true) { // Light was ON
            if (duration > 100 && duration < 400) morseBuffer += ".";
            else if (duration >= 400) morseBuffer += "-";
        } else { // Light was OFF
            if (duration > 600) {
                // अक्षर डिकोड गर्ने लोजिक यहाँ थप्न सकिन्छ
                decodeMorse();
            }
        }
    }

    function decodeMorse() {
        // यो एउटा सरल डिकोडिङ नमुना हो
        if (morseBuffer === ".-") decodedText.innerText += "A";
        else if (morseBuffer === "-...") decodedText.innerText += "B";
        // ... अन्य मर्स कोड थप्दै जानुहोस्
        
        morseBuffer = ""; // बफर खाली गर्ने
    }
</script>
</body>
</html>
